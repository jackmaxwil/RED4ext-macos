name: Format

on: [ push, pull_request ]

jobs:
  format:
    name: clang-format (changed lines)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to the version upstream formats with.
      - name: Install clang-format 18
        run: |
          python3 -m venv .cf
          .cf/bin/pip install -q clang-format==18.1.8

      - name: Check
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$AFTER~1"; fi
          .cf/bin/git-clang-format --binary .cf/bin/clang-format --style file --diff "$BEFORE" "$AFTER"
