name: Build

on: [ push, pull_request ]

jobs:
  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # No game binary on the runner: structural checks of the verified entries only.
      - name: Address database
        run: python3 deps/red4ext.sdk/scripts/validate_addresses.py --verified-only --quiet
